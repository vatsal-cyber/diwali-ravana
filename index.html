<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A0B2E">
<title>Find the Ravana: a Diwali party game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#F7EDE0; --plum:#FFF8EE; --plum2:#F1E2CE;
  --text:#3A1A2E; --muted:#8C5A74; --faint:rgba(58,26,46,.42);
  --gold:#D9A441; --gold2:#A6762A; --gold3:#B8862C; --pink:#E8257D; --pink2:#D9407F;
  --panel:rgba(58,26,46,.05); --line:rgba(166,118,42,.3);
  --btn-bg:linear-gradient(180deg,#FFE7A8 0%,#F3C96B 45%,#C9963A 100%); --btn-fg:#3A1205; --btn-glow:rgba(217,164,65,.45);
  --ghost:rgba(58,26,46,.28); --ok:#B8862C; --okbg:rgba(217,164,65,.16); --low:#E8257D; --jade:#2E9E78;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#F3E6D4;min-height:100%}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:linear-gradient(180deg,#FFF9F0 0%,#F7EBDA 55%,#F1DFC8 100%) fixed}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(70% 45% at 50% 100%,rgba(232,37,125,.12),rgba(232,37,125,0) 70%);pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.disp{font-family:"Rozha One",Georgia,serif;font-weight:400}
h1,h2,h3,p{margin:0}
.ic{width:1em;height:1em;flex:none}

.btn{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;color:var(--btn-fg);background:var(--btn-bg);padding:.6em 1.4em;font-size:1.15rem;line-height:1.2;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(120,70,10,.35),0 10px 26px rgba(0,0,0,.4),0 0 0 1px rgba(255,231,168,.25);transition:transform .16s,box-shadow .16s,opacity .16s;display:inline-flex;align-items:center;justify-content:center;gap:.45em;text-align:center;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.32;cursor:default}
.btn.ghost{background:rgba(255,255,255,.5);color:var(--text);box-shadow:inset 0 0 0 2px var(--ghost)}
.btn.rani{background:var(--text);color:var(--deep)}
.btn.danger{background:#D9342B;color:#fff}
.btn:focus{outline:none}
.btn:focus-visible,.ibtn:focus-visible,.avpick:focus-visible,.vbtn:focus-visible{outline:3px solid var(--text);outline-offset:4px}
.field:focus{outline:none;border-color:var(--gold)}
.ibtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1.5px var(--line);border:0;color:var(--gold2);display:inline-grid;place-items:center;cursor:pointer;padding:0;font-size:21px;flex:none}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:1rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}

.av{--s:56px;width:var(--s);height:var(--s);display:inline-grid;place-items:center;flex:none;position:relative;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#F7E6D2);box-shadow:inset 0 0 0 2px #D9A441,0 3px 8px rgba(120,70,60,.25);overflow:hidden}
.av img{width:88%;height:88%;object-fit:contain;display:block;transform:translateY(4%)}
.av::after{content:"";position:absolute;left:14%;top:4%;width:72%;height:38%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.av.away{filter:grayscale(1) brightness(.6)}
.av.pop{animation:popin .7s cubic-bezier(.2,1.5,.4,1) both}
.diya .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.8s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,190,80,.85))}
.lotus{position:relative;display:block;width:var(--w,150px);height:var(--w,150px)}
.lotus.fluid{width:100%;height:auto;aspect-ratio:1}
.lotus img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 14px 18px rgba(90,40,40,.28))}
.lotus .refl{position:absolute;left:0;top:100%;z-index:0;transform:scaleY(-1);opacity:.7;filter:blur(1.2px);-webkit-mask:linear-gradient(0deg,rgba(0,0,0,.7),transparent 30%);mask:linear-gradient(0deg,rgba(0,0,0,.7),transparent 30%);pointer-events:none}
.lotus .gl{position:absolute;width:8%;height:8%;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,rgba(255,255,255,0) 70%);z-index:3;opacity:0;animation:twinkle 2.6s ease-in-out infinite;pointer-events:none}
.lotus .gl.a{left:27%;top:50%}.lotus .gl.b{left:64%;top:42%;animation-delay:-.9s;animation-duration:3.1s}.lotus .gl.c{left:45%;top:74%;animation-delay:-1.8s;animation-duration:2.2s}
.lotus.dark .gl{display:none}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
@keyframes sway3d{0%,100%{transform:rotateY(-4deg)}50%{transform:rotateY(4deg)}}
.lotus .glow{position:absolute;left:10%;top:0;width:80%;height:70%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.75),rgba(255,160,70,.25) 45%,rgba(255,160,70,0) 70%);z-index:1;animation:glowp 2.6s ease-in-out infinite}
.lotus .pool{position:absolute;left:0;bottom:-6%;width:100%;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,180,80,.45),rgba(255,180,80,0) 70%);z-index:0}
.lotus .flick{position:absolute;left:44%;top:14%;width:12%;height:18%;border-radius:50%;background:radial-gradient(circle,rgba(255,240,190,.9),rgba(255,200,100,0) 70%);z-index:3;mix-blend-mode:screen;animation:flick2 1.1s ease-in-out infinite;pointer-events:none}
.lotus.dark .glow,.lotus.dark .flick,.lotus.dark .pool{display:none}
.lotus .crown3d{position:absolute;left:50%;top:-2%;width:42%;margin-left:-21%;z-index:4;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));animation:crownbob 2s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes flick2{0%,100%{opacity:.6;transform:scale(1) translateY(0)}30%{opacity:1;transform:scale(1.15,1.3) translateY(-6%)}60%{opacity:.75;transform:scale(.95,1.05)}}
@keyframes crownbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8%)}}
.big-diya{width:110px}

@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(.96,1.07) skewX(2.5deg)}45%{transform:scale(1.03,.93) skewX(-2deg)}70%{transform:scale(.98,1.05) skewX(1.5deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes bump{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes dots{0%,20%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
@keyframes swing{0%,100%{transform:translateX(-50%) rotate(-2.2deg)}50%{transform:translateX(-50%) rotate(2.2deg)}}
@keyframes swing2{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes bobf{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes bobs{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.04)}}
@keyframes splash{0%{transform:translateY(-360px) scale(.6);opacity:0}70%{transform:translateY(12px) scale(1.05);opacity:1}100%{transform:none;opacity:1}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bulb{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes refl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
@keyframes lamp{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shadowrise{0%{transform:translateY(120px) scale(.7);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes eyes{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes sweep{0%{left:calc(-10px)}40%{left:calc(100% - 300px)}100%{left:calc(var(--x) - 280px)}}
@keyframes fall{0%{transform:translate3d(0,-60px,0) rotate(0)}100%{transform:translate3d(60px,900px,0) rotate(420deg)}}
@keyframes driftp{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-6px)}}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}

/* ======================= TV: clean ======================= */
.tv{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;font-size:32px;overflow:hidden;z-index:1;background:linear-gradient(180deg,#FFF9F0 0%,#F7EBDA 50%,#F0DCC4 100%)}
.tv::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 100%,rgba(232,37,125,.13),rgba(232,37,125,0) 70%);pointer-events:none}
.glowbg{position:absolute;left:50%;top:50%;width:1600px;height:1000px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(255,255,255,.6),rgba(255,255,255,0) 60%);pointer-events:none}
.medal{position:absolute;left:50%;top:56%;width:1700px;height:1700px;transform:translate(-50%,-50%);opacity:.11;pointer-events:none;animation:spin 600s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 60%);mask:radial-gradient(circle,#000 20%,transparent 60%)}
.medal svg{width:100%;height:100%;display:block}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.frame{position:absolute;left:44px;right:44px;top:44px;bottom:44px;border:1.5px solid rgba(166,118,42,.45);border-radius:22px;pointer-events:none}
.frame::before{content:"";position:absolute;inset:7px;border:1px solid rgba(166,118,42,.2);border-radius:16px}
.frame i{position:absolute;width:26px;height:26px;border:1.5px solid rgba(166,118,42,.8);transform:rotate(45deg);background:#FFF9F0}
.frame i:nth-child(1){left:-14px;top:-14px}.frame i:nth-child(2){right:-14px;top:-14px}.frame i:nth-child(3){left:-14px;bottom:-14px}.frame i:nth-child(4){right:-14px;bottom:-14px}
/* bells: one pair hanging from the frame */
.bells{position:absolute;left:0;right:0;top:-8px;pointer-events:none;z-index:6;perspective:900px}
.bell{position:absolute;top:0;width:78px;height:166px;transform-origin:50% 3%;animation:bellsway 5.2s ease-in-out infinite;transform-style:preserve-3d}
.bell.l{left:112px}.bell.r{right:112px;animation-delay:-2.4s;animation-duration:6.1s}
.bellsvg{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(90,40,40,.35))}
.bell .gleam{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 62%);background-size:260% 100%;background-position:130% 0;-webkit-mask:url(art/bell.png) center/contain no-repeat;mask:url(art/bell.png) center/contain no-repeat;opacity:0;mix-blend-mode:screen}
.tv.ring .bell{animation:bellring 2.2s cubic-bezier(.25,.6,.3,1) 1 both}
.tv.ring .bell.r{animation-delay:.12s}
.tv.ring .bell .gleam{animation:gleam 1.1s .15s ease-out 1 both}
@keyframes gleam{0%{opacity:0;background-position:130% 0}15%{opacity:1}100%{opacity:0;background-position:-30% 0}}
@keyframes bellsway{0%,100%{transform:rotate(-3.5deg) rotateY(-12deg)}50%{transform:rotate(3.5deg) rotateY(12deg)}}
@keyframes bellring{0%{transform:rotate(0)}10%{transform:rotate(-24deg) rotateY(-18deg)}26%{transform:rotate(19deg) rotateY(14deg)}42%{transform:rotate(-13deg) rotateY(-10deg)}58%{transform:rotate(8deg) rotateY(6deg)}74%{transform:rotate(-4deg)}88%{transform:rotate(2deg)}100%{transform:rotate(0)}}
/* Ravana rising behind the row */
.ravbg{position:absolute;left:50%;top:150px;width:900px;height:940px;margin-left:-450px;z-index:0;pointer-events:none;opacity:0;transform:translateY(160px) scale(.9);transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.9,.3,1)}
.tv.rav-on .ravbg{opacity:.26;transform:none}
.ravbg::before{content:"";position:absolute;left:15%;top:5%;width:70%;height:48%;border-radius:50%;background:radial-gradient(circle,rgba(232,37,125,.6),rgba(232,37,125,0) 68%);filter:blur(16px);animation:ravaura 3.4s ease-in-out infinite}
.ravimg{position:relative;width:100%;height:100%;object-fit:contain;display:block;-webkit-mask:linear-gradient(180deg,#000 40%,transparent 78%);mask:linear-gradient(180deg,#000 40%,transparent 78%);filter:saturate(.85);transform-origin:50% 100%}
.tv.rav-on .ravimg{animation:ravin 1.5s cubic-bezier(.2,.9,.3,1) 1,ravbreathe 7s ease-in-out 1.5s infinite}
@keyframes ravbreathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}
@keyframes ravaura{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes ravin{0%{transform:scale(.94)}55%{transform:scale(1.015)}65%{transform:scale(1.01) translateX(-4px)}75%{transform:translateX(4px)}85%{transform:translateX(-2px)}100%{transform:none}}
.ravsil .eye{animation:eyes 2.2s ease-in-out infinite}
@keyframes eyes{0%,100%{opacity:.55}50%{opacity:1}}
.tv.rav-on .medal{opacity:.05}
.tv.rav-on .sparks{opacity:.4}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;width:var(--sz,3px);height:var(--sz,3px);border-radius:50%;background:#E8A23A;opacity:.45;animation:spark var(--d,8s) ease-in-out infinite;animation-delay:var(--dl,0s);box-shadow:0 0 10px 2px rgba(232,162,58,.35)}
@keyframes spark{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:.7;transform:translateY(-14px)}}
.top{position:absolute;left:170px;right:170px;top:80px;height:70px;display:flex;align-items:center;gap:30px}
.brand{display:flex;align-items:center;gap:10px;font-size:34px;color:var(--text);line-height:1;width:360px;flex:none}
.brand-lotus{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(90,40,40,.3))}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:28px}
.mid .k{font-size:26px;color:var(--muted);font-weight:600;white-space:nowrap}
.mid .code{font-size:40px;color:var(--text);letter-spacing:.14em;line-height:1;padding-top:6px}
.track{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:26px}
.track li{font-size:24px;white-space:nowrap;font-weight:600;color:rgba(58,26,46,.3);transition:color .3s}
.track li.done{color:var(--muted)}
.track li.cur{color:var(--pink)}
.tools{display:flex;align-items:center;gap:14px;width:360px;justify-content:flex-end;flex:none}
.roomchip{font-size:24px;color:var(--muted);display:flex;align-items:center;gap:12px;margin-right:6px;font-weight:600}
.roomchip b{color:var(--text);font-size:28px;letter-spacing:.08em;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#777}
.dot.on{background:var(--jade);box-shadow:0 0 10px var(--jade)}
.dot.off{background:var(--gold);animation:dots 1.2s infinite}
.tv .ibtn{width:58px;height:58px;font-size:26px;background:rgba(58,26,46,.06);box-shadow:none;color:var(--gold2)}
.tv .ibtn:focus{outline:4px solid var(--text);outline-offset:5px}
.sky{position:absolute;left:200px;right:200px;top:176px;height:370px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:4}
.sky>*{position:relative}
.h1{font-family:"Rozha One",Georgia,serif;font-weight:400;font-size:96px;line-height:1.04;color:var(--text);text-shadow:0 1px 0 #fff,0 10px 30px rgba(120,70,60,.18)}
.h2{font-family:"Rozha One",Georgia,serif;font-weight:400;font-size:60px;line-height:1.08}
.sky .sub{font-size:34px;color:var(--muted);margin-top:14px;max-width:1100px;line-height:1.3;font-weight:500}
.sky .sub b{color:var(--text);font-weight:700}
.sky .sub.small{font-size:28px;margin-top:8px}
.sname{font-size:150px;animation:rise .5s .1s both;max-width:1400px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--pink);text-shadow:0 1px 0 #fff,0 2px 0 #f4b2cf,0 3px 0 #e59ab9,0 16px 34px rgba(232,37,125,.25)}
.tbar{width:520px;height:8px;border-radius:99px;background:rgba(58,26,46,.1);overflow:hidden;margin:26px auto 0}
.tbar i{display:block;height:100%;background:var(--gold);transform-origin:left center;transition:transform .25s linear;border-radius:99px}
.tbar i.low{background:var(--pink)}
.talk{display:flex;align-items:center;gap:70px;text-align:left}
.talk .h1.dq{font-size:80px}
.ringwrap{position:relative;width:230px;height:230px;flex:none}
.ring{width:100%;height:100%;display:block}
.ring .trk{fill:none;stroke:rgba(58,26,46,.1);stroke-width:8}
.ring .prog{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .prog.low{stroke:var(--pink)}
.ringin{position:absolute;inset:0;display:grid;place-items:center;font-family:"Rozha One",Georgia,serif;font-size:92px;line-height:1;padding-top:8px;color:var(--text)}
.gbox{margin-top:18px;min-width:640px;min-height:120px;border-radius:26px;background:rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(120,70,60,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 44px}
.gtext{font-size:76px;line-height:1.05;color:var(--text)}
.verdict{font-size:28px;font-weight:700;border-radius:999px;padding:2px 22px}
.verdict.ok{background:var(--gold);color:var(--btn-fg)}
.verdict.no{background:var(--pink);color:#fff}
.typing{font-size:36px;color:var(--muted)}
.typing i{font-style:normal;animation:dots 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.verdict-s{display:flex;flex-direction:column;align-items:center}
.verdict-s .r1{font-size:36px;color:var(--muted);font-weight:600;animation:fade .5s .1s both}
.verdict-s .rname{font-size:130px;animation:popin .7s .5s cubic-bezier(.2,1.5,.4,1) both;margin:0 0 18px}
.stamp{font-size:66px;line-height:1;padding:16px 44px 6px;border-radius:20px;transform:rotate(-4deg);animation:stamp .45s 2.3s cubic-bezier(.2,1.8,.4,1) both;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.18),0 16px 34px rgba(0,0,0,.45)}
.verdict-s.good .stamp{background:#F3C96B;color:#3A1205}
.verdict-s.bad .stamp{background:var(--pink);color:#fff}
@keyframes stamp{0%{opacity:0;transform:rotate(-4deg) scale(2.6)}100%{opacity:1;transform:rotate(-4deg) scale(1)}}
.reveal{display:flex;flex-direction:column;align-items:center}
.r1{font-size:36px;color:var(--muted);font-weight:600;animation:fade .6s .2s both}
.reveal .r2{font-size:120px;animation:popin .8s 1.55s cubic-bezier(.2,1.4,.4,1) both;margin:0;color:var(--pink)}
.reveal.bad .r1{animation-delay:0s}.reveal.bad .r3{animation-delay:2.2s}.reveal.bad .r4{animation-delay:2.6s}
.r3{font-size:36px;color:var(--muted);animation:rise .6s 2.4s both;font-weight:600;margin-top:8px}
.rword{font-size:80px;color:var(--gold3);margin-left:14px;vertical-align:-4px}

.r4{font-size:32px;margin-top:14px;animation:rise .6s 2.9s both;max-width:1100px;color:var(--text);line-height:1.3}
.reveal.quick .r3{animation-delay:.25s}.reveal.quick .r4{animation-delay:.9s}
.reveal .r3.big{margin-top:4px}
.reveal .r3.big .rword{font-size:170px;margin:0;line-height:1.05;display:inline-block;color:#C7902A;text-shadow:0 1px 0 #fff,0 2px 0 #f0d9a0,0 3px 0 #dcc083,0 16px 34px rgba(199,144,42,.3)}
.ftitle{font-size:110px}
.roundcard{position:absolute !important;inset:-160px -400px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle,rgba(255,249,240,.98) 0%,rgba(255,249,240,.92) 40%,transparent 70%);animation:rcard 2.3s ease both;pointer-events:none}
.roundcard span{font-size:220px;line-height:1;color:var(--pink)}
.roundcard small{font-size:40px;color:var(--muted);font-weight:600}
@keyframes rcard{0%{opacity:0;transform:scale(.94)}12%{opacity:1;transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04);visibility:hidden}}
.lobbysky{display:flex;align-items:center;gap:80px;text-align:left}
