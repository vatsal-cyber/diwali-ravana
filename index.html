<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A0B2E">
<title>Find the Ravana: a Diwali party game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#1A0B2E; --ground2:#2B1150; --deep:#12071F; --plum:#24104A;
  --marigold:#FFB22E; --saffron:#FF8A1F; --rani:#F2367D; --peacock:#19B3A3;
  --chalk:#FFF3DF; --sindoor:#E5412D; --lilac:#BBA9DD; --dot:rgba(255,243,223,.075);
  --line:rgba(255,243,223,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--chalk);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600}
body{background:radial-gradient(120% 80% at 50% -10%,#3A1766 0%,var(--ground) 52%,var(--deep) 100%) fixed;overflow-x:hidden}
/* the floor is a kolam dot grid, the guide dots you draw rangoli on */
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(circle,var(--dot) 1.7px,transparent 2.3px);background-size:34px 34px;pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.disp{font-family:"Rozha One",Georgia,serif;font-weight:400}
h1,h2,h3,p{margin:0}
.ic{width:1em;height:1em;flex:none}

/* ---------- buttons ---------- */
.btn{font:inherit;font-weight:800;border:0;border-radius:999px;cursor:pointer;color:var(--deep);background:var(--marigold);padding:.62em 1.35em;font-size:1.15rem;line-height:1.15;box-shadow:inset 0 -.2em 0 rgba(0,0,0,.18);transition:transform .14s,box-shadow .14s,background .14s,opacity .14s;display:inline-flex;align-items:center;justify-content:center;gap:.45em;text-align:center}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ghost{background:rgba(255,243,223,.04);color:var(--chalk);box-shadow:none;border:3px solid rgba(255,243,223,.32);padding:calc(.62em - 3px) calc(1.35em - 3px)}
.btn.rani{background:var(--rani);color:#fff}
.btn.danger{background:var(--sindoor);color:#fff;border-color:transparent}
.btn.sel{background:var(--chalk);color:var(--deep);border-style:solid;border-color:var(--chalk)}
.btn:focus{outline:none}
.btn:focus-visible,.ibtn:focus-visible,.avpick:focus-visible,.vbtn:focus-visible,.field:focus{outline:none;box-shadow:0 0 0 4px var(--ground),0 0 0 8px var(--chalk),0 0 34px 8px rgba(255,178,46,.5)}
.ibtn{width:48px;height:48px;border-radius:50%;background:rgba(255,243,223,.08);border:0;color:var(--chalk);display:inline-grid;place-items:center;cursor:pointer;padding:0;font-size:22px;flex:none}
.linkbtn{background:none;border:0;color:var(--lilac);font:inherit;font-size:1rem;text-decoration:underline;cursor:pointer;padding:8px}

/* ---------- avatars ---------- */
.av{--c:#FFB22E;--s:56px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;background:var(--c);flex:none;position:relative;
  box-shadow:0 0 0 calc(var(--s)*.055) var(--ground),0 0 0 calc(var(--s)*.1) var(--c)}
.av .avi{font-size:calc(var(--s)*.56);line-height:1;transform:translateY(2%)}
.av.ini .avi{font-family:"Rozha One",Georgia,serif;color:var(--deep);font-size:calc(var(--s)*.52);transform:translateY(8%)}
.av.away{filter:grayscale(.9) brightness(.62)}
.av.red{box-shadow:0 0 0 calc(var(--s)*.055) var(--ground),0 0 0 calc(var(--s)*.1) var(--sindoor),0 0 calc(var(--s)*.5) calc(var(--s)*.08) rgba(229,65,45,.55)}
.av.ghost{background:transparent;box-shadow:none;border:3px dotted rgba(255,243,223,.25)}
.av.pop{animation:popin .7s cubic-bezier(.2,1.6,.4,1) both}

/* ---------- diya ---------- */
.diya .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.7s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,178,46,.9))}
.big-diya{width:120px}
.hero-diya{width:150px}

/* ---------- motion ---------- */
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(.96,1.07) skewX(2.5deg)}45%{transform:scale(1.03,.93) skewX(-2deg)}70%{transform:scale(.98,1.05) skewX(1.5deg)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spin2{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes bump{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes dots{0%,20%{opacity:.2}50%{opacity:1}100%{opacity:.2}}

/* ======================= TV ======================= */
.tv{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;font-size:32px;overflow:hidden;z-index:1}
.tv .toran{position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none}
.tv .toran svg{width:1920px;height:120px;display:block}
.tvh{position:absolute;left:64px;right:64px;top:100px;height:92px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:12px;font-size:40px;color:var(--chalk);line-height:1;width:470px}
.brand-diya{width:60px}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:34px}
.midtxt{font-size:32px;color:var(--lilac);font-weight:700}
.rnd{font-size:32px;font-weight:800;color:var(--chalk);white-space:nowrap}
.rnd small{font-size:inherit;color:var(--lilac);font-weight:700}
.track{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:6px}
.track li{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:700;color:rgba(255,243,223,.38);padding:6px 16px;border-radius:999px;transition:color .3s,background .3s}
.track li i{width:12px;height:12px;border-radius:50%;background:rgba(255,243,223,.25);flex:none}
.track li.done{color:var(--lilac)}
.track li.done i{background:var(--lilac)}
.track li.cur{color:var(--deep);background:var(--marigold)}
.track li.cur i{background:var(--deep)}
.tools{display:flex;align-items:center;gap:14px;width:470px;justify-content:flex-end}
.roomchip{font-size:30px;color:var(--lilac);display:flex;align-items:center;gap:12px;margin-right:6px}
.roomchip b{color:var(--chalk);font-size:36px;letter-spacing:.06em}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;background:#777}
.dot.on{background:#4FD18B;box-shadow:0 0 12px #4FD18B}
.dot.off{background:var(--marigold);animation:dots 1.2s infinite}
.tv .ibtn{width:70px;height:70px;font-size:32px;background:rgba(255,243,223,.07)}
.tvm{position:absolute;left:64px;right:64px;top:204px;bottom:132px;display:grid;grid-template-columns:1fr 470px;gap:56px}
.stagewrap{position:relative;min-width:0}
.bgr{position:absolute;left:50%;top:50%;width:980px;height:980px;transform:translate(-50%,-50%);opacity:.045;animation:spin 300s linear infinite;pointer-events:none}
.bgr svg,.qrring svg,.halo svg,.fr svg,.rdraw svg{width:100%;height:100%;display:block}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stage>*{position:relative}
.h1{font-family:"Rozha One",Georgia,serif;font-weight:400;font-size:100px;line-height:1.02;letter-spacing:.005em}
.h2{font-family:"Rozha One",Georgia,serif;font-weight:400;font-size:64px;line-height:1.05}
.stage .sub{font-size:40px;color:var(--lilac);margin-top:16px;max-width:1150px;line-height:1.25;font-weight:600}
.stage .sub b{color:var(--chalk)}
.topic{display:inline-block;background:rgba(187,169,221,.14);color:var(--chalk);border-radius:999px;padding:6px 30px;font-size:32px;font-weight:700;margin-bottom:22px}
.actrow{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:34px}
.tv .btn{font-size:36px;padding:20px 46px}
.tv .btn.ghost{padding:17px 43px}
.tv .btn.big{font-size:46px;padding:24px 64px}
.tv .btn{white-space:nowrap}
.tv .btn.chip{font-size:28px;padding:7px 26px;background:transparent;color:var(--lilac);box-shadow:none;border:3px solid rgba(255,243,223,.2)}
.tv .btn.chip.sel{background:var(--chalk);color:var(--deep);border-color:var(--chalk)}
.tv .btn.chip.danger{background:var(--sindoor);color:#fff;border-color:var(--sindoor)}
.tv .btn:focus,.tv .ibtn:focus{outline:none;box-shadow:0 0 0 6px var(--ground),0 0 0 13px var(--chalk),0 0 60px 16px rgba(255,178,46,.55);transform:scale(1.06);z-index:2}
.tv .btn.ghost:focus{border-color:transparent}
.tv .note{font-size:30px;color:var(--lilac);font-weight:600}
.tchip{display:inline-flex;align-items:center;gap:12px;font-size:40px;color:var(--lilac)}
.tnum{font-variant-numeric:tabular-nums}
.tnum.low,.low .tnum{color:var(--rani)}

/* rail */
.rail{border-left:2px solid rgba(255,243,223,.09);padding-left:40px;display:flex;flex-direction:column;min-height:0}
.rail h3{font-size:32px;color:var(--lilac);font-weight:700;margin:4px 0 10px;display:flex;justify-content:space-between}
.rail h3 span{color:var(--chalk);opacity:.7}
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:20px;padding:10px 0;border-bottom:2px solid rgba(255,243,223,.06);font-size:34px;min-height:84px}
.prow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;display:flex;align-items:center;gap:10px}
.prow .sc{font-size:46px;color:var(--chalk);min-width:56px;text-align:right;line-height:1}
.prow.isaway .nm{color:var(--lilac)}
.prow.new{animation:rise .7s cubic-bezier(.2,1.4,.4,1) both}
.prow.empty .nm{color:rgba(255,243,223,.28);font-weight:600}
.crown{color:var(--marigold);display:inline-flex;font-size:.9em}
.st{display:inline-flex;align-items:center;gap:6px;font-size:24px;color:var(--lilac);font-weight:700}
.st.ok{color:var(--peacock);font-size:40px}
.st.away .ic{font-size:26px}
.delta{background:var(--peacock);color:var(--deep);border-radius:999px;padding:0 16px;font-weight:800;font-size:30px;animation:bump .9s 3.2s both}

/* footer */
.tvf{position:absolute;left:64px;right:64px;bottom:30px;height:90px;display:flex;align-items:center;gap:22px;font-size:34px;border-top:2px solid rgba(255,243,223,.09);padding-top:14px;color:var(--chalk)}
.tvf>.ic{font-size:44px;color:var(--marigold)}
.tvf .muted{margin-left:auto;font-size:26px;color:var(--lilac);white-space:nowrap;display:flex;align-items:center;gap:8px}
.tvf .warn{margin-left:auto;font-size:28px;color:var(--marigold);white-space:nowrap}

/* lobby */
.lobby{display:grid;grid-template-columns:440px 1fr;gap:70px;align-items:center;width:100%;text-align:left}
.qrcol{display:flex;flex-direction:column;align-items:center}
.qrwrap{position:relative;width:440px;height:440px;display:grid;place-items:center}
.qrring{position:absolute;inset:0;animation:spin2 120s linear infinite;opacity:.9}
.qr{position:relative;width:282px;height:282px;background:var(--chalk);border-radius:26px;padding:12px;box-shadow:0 0 0 10px var(--ground)}
.qr svg{width:100%;height:100%;display:block}
.cap{margin-top:14px;font-size:34px;font-weight:700;color:var(--chalk)}
.joinat{font-size:38px;color:var(--lilac);font-weight:600}
.joinat b{color:var(--chalk);font-weight:800}
.digits{display:flex;gap:20px;margin:16px 0 34px}
.digit{width:132px;height:156px;border:4px dotted var(--marigold);border-radius:30px;display:grid;place-items:center;font-size:124px;line-height:1;color:var(--marigold);padding-top:14px}
.opts{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}
.optrow{display:flex;align-items:center;gap:14px}
.optrow .lbl{width:180px;font-size:32px;color:var(--lilac)}
.startrow{display:flex;align-items:center;gap:30px}
.startrow .note{max-width:520px;line-height:1.25}

/* round title card */
.roundcard{position:absolute !important;inset:-40px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle,#2E1256 0%,var(--ground) 62%);border-radius:40px;animation:rcard 2.3s ease both;pointer-events:none}
.roundcard span{font-size:190px;line-height:1;color:var(--marigold)}
.roundcard small{font-size:44px;color:var(--chalk);font-weight:700}
@keyframes rcard{0%{opacity:0;transform:scale(.9)}12%{opacity:1;transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05);visibility:hidden}}
/* peek */
.readyrow{display:flex;gap:30px;justify-content:center;margin-top:40px;flex-wrap:wrap}
.rchip{position:relative;opacity:.5;transition:opacity .3s}
.rchip.ok{opacity:1}
.rchip .tick{position:absolute;right:-10px;bottom:-8px;width:42px;height:42px;border-radius:50%;background:var(--peacock);color:var(--deep);display:grid;place-items:center;font-size:28px;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 5px var(--ground)}
.rchip.ok .tick{transform:scale(1)}

/* clues */
.cluewrap{display:flex;align-items:center;gap:80px;text-align:left}
.ctext{display:flex;flex-direction:column;align-items:flex-start}
.ctext .topic{margin-bottom:10px}
.ctext .sub{margin-top:6px}
.ctext .tbar{width:560px;margin:26px 0 0}
.speaker{position:relative;width:210px;height:210px;display:grid;place-items:center;margin:50px}
.speaker .av{animation:popin .6s cubic-bezier(.2,1.6,.4,1) both}
.halo{position:absolute;left:50%;top:50%;width:330px;height:330px;margin:-165px 0 0 -165px;opacity:.5;animation:spin2 40s linear infinite}
.sname{font-size:124px;animation:rise .5s .1s both;max-width:700px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar{width:820px;height:14px;border-radius:99px;background:rgba(255,243,223,.12);overflow:hidden;margin:26px auto 0}
.tbar i{display:block;height:100%;background:var(--marigold);transform-origin:left center;transition:transform .25s linear}
.tbar i.low{background:var(--rani)}
.order{list-style:none;padding:0;margin:40px 0 0;display:flex;gap:26px;justify-content:center}
.order li{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;transition:opacity .3s,transform .3s}
.order li.done{opacity:.32}
.order li.cur{transform:translateY(-6px)}
.order li.cur .av{box-shadow:0 0 0 5px var(--ground),0 0 0 10px var(--marigold),0 0 34px 6px rgba(255,178,46,.6)}
.order .num{position:absolute;top:-8px;left:-8px;width:34px;height:34px;border-radius:50%;background:var(--ground);border:2px solid var(--line);font-size:20px;display:grid;place-items:center;z-index:1;color:var(--lilac)}
.order .onm{font-size:24px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.h1.dq{font-size:80px}
.dq+.ringwrap{width:360px;height:360px;margin-top:26px}
/* timer ring */
.ringwrap{position:relative;width:400px;height:400px;margin-top:20px}
.ring{width:100%;height:100%;display:block}
.ring .trk{fill:none;stroke:rgba(255,243,223,.1);stroke-width:14}
.ring .prog{fill:none;stroke:var(--marigold);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .prog.low{stroke:var(--rani)}
.ringin{position:absolute;inset:0;display:grid;place-items:center;font-family:"Rozha One",Georgia,serif;font-size:150px;line-height:1;padding-top:16px}

/* vote */
.votehead{display:flex;align-items:center;gap:40px}
.votehead .ringwrap{width:150px;height:150px;margin:0}
.votehead .ringin{font-size:56px;padding-top:6px}
.vgrid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;max-width:1240px;margin-top:30px}
.vt{width:280px;padding:22px 10px 18px;border-radius:34px;border:3px solid rgba(255,243,223,.1);background:rgba(255,243,223,.03);display:flex;flex-direction:column;align-items:center;gap:10px;transition:border-color .3s,background .3s}
.vt .vn{font-size:34px;font-weight:800;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt .vs{font-size:26px;color:var(--lilac);display:flex;align-items:center;gap:6px}
.vt.voted{border-style:solid;border-color:var(--peacock);background:rgba(25,179,163,.12)}
.vt.voted .vs{color:var(--peacock)}

/* guess */
.caught .av{animation:popin .6s cubic-bezier(.2,1.6,.4,1) both}
.caught{margin-bottom:24px}
.stage .caught+.h1{font-size:84px}
.gbox{margin-top:30px;min-width:760px;min-height:170px;border:3px solid rgba(255,243,223,.14);background:rgba(255,243,223,.04);border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 40px}
.gtext{font-size:96px;line-height:1.05;color:var(--chalk)}
.verdict{font-size:36px;font-weight:800;border-radius:999px;padding:2px 26px}
.verdict.ok{background:var(--peacock);color:var(--deep)}
.verdict.no{background:var(--sindoor);color:#fff}
.typing{font-size:40px;color:var(--lilac)}
.typing i{font-style:normal;animation:dots 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* reveal: the one big moment */
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
.rdraw{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;opacity:.36;pointer-events:none}
.rdraw .draw path,.rdraw .draw circle{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease-out forwards}
.reveal.bad .rdraw{opacity:.32;filter:hue-rotate(-25deg) saturate(1.4)}
.r1{font-size:44px;color:var(--lilac);animation:fade .6s .2s both}
.r2{display:flex;align-items:center;gap:36px;margin:18px 0 10px;animation:popin .8s 1.55s cubic-bezier(.2,1.5,.4,1) both}
.rname{font-size:150px;line-height:1}
.reveal.bad .rname{color:#FF7A66}
.r3{font-size:44px;color:var(--lilac);animation:rise .6s 2.4s both}
.rword{font-size:92px;color:var(--marigold);margin-left:14px;vertical-align:-6px}
.r4{font-size:40px;margin-top:14px;animation:rise .6s 2.9s both;max-width:1200px}
.r5{animation:rise .6s 3.3s both}
.r6{animation:rise .6s 3.6s both}
.vchips{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 26px;margin-top:22px;max-width:1200px}
.vchip{display:flex;align-items:center;gap:10px;font-size:30px;color:var(--lilac);padding:6px 14px;border-radius:999px;background:rgba(255,243,223,.06)}
.vchip.right{background:rgba(25,179,163,.18);color:var(--peacock)}

/* final */
.ftitle{font-size:92px}
.stage .fsub{margin-top:4px}
.podium{display:flex;align-items:flex-end;gap:40px;margin-top:26px}
.pod{display:flex;flex-direction:column;align-items:center;gap:10px;width:300px;animation:rise .8s both}
.pod.p1{animation-delay:1.2s}.pod.p2{animation-delay:.6s}.pod.p3{animation-delay:.2s}
.pod.none{visibility:hidden}
.pnm{font-size:40px;font-weight:800;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psc{font-size:32px;color:var(--lilac);font-weight:700;line-height:1}
.block{width:100%;border-radius:28px 28px 0 0;display:grid;place-items:center;font-size:96px;color:var(--deep)}
.p1 .block{height:200px;background:var(--marigold)}
.p2 .block{height:140px;background:var(--chalk)}
.p3 .block{height:96px;background:var(--saffron)}

/* overlays */
.ov{position:absolute;inset:0;background:rgba(18,7,31,.9);display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .25s both}
.ovin{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.ovin .sub{font-size:40px;color:var(--lilac)}
.ovin.set{align-items:stretch;text-align:left;gap:20px;width:1400px}
.ovin.set .h2{font-size:80px;margin-bottom:10px}
.setrow{display:flex;align-items:center;gap:20px;font-size:32px;padding-bottom:18px;border-bottom:2px solid rgba(255,243,223,.08)}
.setrow.wrap{flex-wrap:wrap}
.setrow .lbl{width:240px;color:var(--lilac);flex:none;font-size:30px;margin:0}
.setrow .val{min-width:110px;text-align:center;font-size:40px}

.ovin.set .actrow{justify-content:flex-start;margin-top:10px}

/* ======================= PHONE + HOME ======================= */
.ph{position:relative;min-height:100vh;min-height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 20px)}
.phh{display:flex;align-items:center;gap:12px;padding:6px 0 10px;min-height:60px}
.phh .who{font-weight:800;font-size:20px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phh .room{margin-left:auto;color:var(--lilac);font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.phh .dot{width:10px;height:10px}
.phm{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;padding-bottom:10px}
.ph .h2{font-size:38px}
.ph .sub{font-size:19px;color:var(--lilac);line-height:1.35}
.ph .sub b{color:var(--chalk)}
.ph .note{font-size:16px;color:var(--lilac)}
.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.acts{display:flex;flex-direction:column;gap:12px;width:100%;align-items:stretch;margin-top:6px}
.ph .btn{font-size:20px;padding:15px 22px}
.ph .btn.ghost{padding:12px 19px}
.ph .btn.big{font-size:23px;padding:19px 24px}
.status{font-size:18px;color:var(--peacock);display:flex;align-items:center;justify-content:center;gap:6px;min-height:28px}
.mini{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0}
.mchip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(255,243,223,.07);font-size:16px}
.mchip .av{--s:28px !important}

/* the secret card */
.card3d{perspective:1300px;height:min(52vh,440px);width:min(100%,calc(min(52vh,440px)*.74));margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.card3d.small{height:min(30vh,250px);width:min(100%,calc(min(30vh,250px)*.95))}
.card3d .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.card3d.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden;gap:8px}
.front{background:linear-gradient(165deg,#3D1872,#22104A);border:3px dotted rgba(255,178,46,.6)}
.front .fr{position:absolute;width:150%;height:150%;left:-25%;top:-25%;opacity:.16;animation:spin2 90s linear infinite}
.front .card-diya{width:110px;position:relative}
.card3d.small .card-diya{width:70px}
.front .hold{position:relative;font-size:20px;font-weight:800;color:var(--chalk)}
.card3d.small .front .hold{font-size:16px}
.back{transform:rotateY(180deg);background:var(--chalk);color:var(--deep);border:6px solid var(--marigold)}
.back.rav{background:var(--sindoor);color:#fff;border-color:#FF9A87}
.back .kick{font-size:17px;font-weight:700;opacity:.75}
.back .cw{font-size:clamp(34px,11vw,56px);line-height:1.05;word-break:break-word}
.card3d.small .back .cw{font-size:clamp(28px,8vw,40px)}
.back .ct{font-size:16px;line-height:1.3;max-width:240px}
.turn{background:var(--marigold);color:var(--deep);border-radius:22px;padding:16px;font-size:24px;font-weight:800;animation:breathe 1.3s ease-in-out infinite}
.upnow{display:flex;align-items:center;gap:14px;justify-content:center;text-align:left}
.upnow .k{display:block;font-size:15px;color:var(--lilac)}
.upnow b{font-size:26px}
.vlist{display:flex;flex-direction:column;gap:10px;text-align:left}
.vbtn{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px;border-radius:999px;border:3px solid rgba(255,243,223,.14);background:transparent;color:var(--chalk);font:inherit;font-size:22px;font-weight:800;cursor:pointer;min-height:68px}
.vbtn .vnm{flex:1;text-align:left}
.vbtn .ic{font-size:26px;color:var(--marigold)}
.vbtn.sel{border-color:var(--marigold);background:rgba(255,178,46,.16)}
.pts{font-size:96px;line-height:1;color:var(--lilac)}
.pts.got{color:var(--marigold);animation:popin .7s .2s cubic-bezier(.2,1.6,.4,1) both}
.gform{display:flex;flex-direction:column;gap:12px;width:100%}
.ph .tnum{color:var(--chalk);font-weight:800}

.field{width:100%;font:inherit;font-size:24px;font-weight:700;padding:14px 18px;border-radius:18px;border:3px solid rgba(255,243,223,.22);background:rgba(255,243,223,.06);color:var(--chalk);outline:none}
.field::placeholder{color:rgba(255,243,223,.35)}
.field.code{font-size:56px;text-align:center;letter-spacing:.3em;padding:10px 0 4px .3em}
.stack{display:flex;flex-direction:column;gap:12px;text-align:left}
.lbl{font-size:16px;color:var(--lilac);font-weight:700;margin-top:6px}
.err{color:#FF8F80;font-size:17px}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avpick{background:none;border:0;padding:10px 0;border-radius:20px;display:flex;justify-content:center;cursor:pointer}
.avpick.sel{background:rgba(255,243,223,.12);box-shadow:inset 0 0 0 3px var(--marigold)}
.avpick[disabled]{opacity:.2;cursor:default}

.backdrop{position:fixed;inset:0;background:rgba(10,4,20,.6);z-index:40;animation:fade .2s both}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--plum);border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);z-index:41;display:flex;flex-direction:column;gap:12px;animation:rise .25s both}
.sheet h3{font-size:30px;text-align:center;margin-bottom:4px}
.pov{position:fixed;inset:0;background:rgba(18,7,31,.94);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px;animation:fade .25s both}
.netbar{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);background:var(--marigold);color:var(--deep);font-weight:800;padding:6px 16px;border-radius:999px;z-index:35;font-size:15px}

/* home */
.home{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 110px) 20px calc(env(safe-area-inset-bottom) + 30px);text-align:center;gap:26px}
.htoran{position:absolute;left:0;right:0;top:0;height:110px;overflow:hidden;pointer-events:none}
.htoran svg{width:max(100%,900px);height:110px;display:block;margin:0 auto}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px}
.title{font-size:clamp(54px,11vw,128px);line-height:.98;color:var(--chalk)}
.tag{font-size:clamp(18px,2.4vw,28px);color:var(--lilac);max-width:640px;line-height:1.3}
.choices{display:flex;flex-direction:column;gap:14px;width:100%;max-width:480px}
.choices .btn{width:100%;font-size:clamp(20px,2.3vw,28px);padding:18px 24px}
.choices .btn.ghost{padding:15px 21px}
.foot{font-size:16px;color:var(--lilac)}
.lan{display:flex;flex-direction:column;gap:10px}
.lanbtn{background:var(--peacock);color:var(--deep);justify-content:flex-start;text-align:left;gap:14px;width:100%;animation:rise .5s both}
.lanbtn .ic{font-size:34px}
.lanbtn span{display:flex;flex-direction:column;line-height:1.15}
.lanbtn small{font-size:.7em;font-weight:700;opacity:.8}
.ph.form .phm{justify-content:flex-start;padding-top:10px}
@media (min-width:900px) and (min-height:600px){ .home .btn:focus{box-shadow:0 0 0 5px var(--ground),0 0 0 10px var(--chalk),0 0 50px 12px rgba(255,178,46,.55);transform:scale(1.04)} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
