<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A0B2E">
<title>Find the Ravana: a Diwali party game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  --night:#140A24; --night2:#1E1234; --night3:#2A1A45; --ink:#0D0618;
  --gold:#F2B544; --gold2:#FFD27A; --ivory:#FBF1DF; --muted:#A898C6; --faint:rgba(251,241,223,.42);
  --jade:#3CC6A8; --vermilion:#EF5A42; --line:rgba(251,241,223,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--ivory);font-family:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(110% 70% at 50% -8%,#2B1650 0%,var(--night) 55%,var(--ink) 100%) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(circle,rgba(251,241,223,.05) 1.4px,transparent 2px);background-size:36px 36px;pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.disp{font-family:"Rozha One",Georgia,serif;font-weight:400}
h1,h2,h3,p{margin:0}
.ic{width:1em;height:1em;flex:none}

/* buttons */
.btn{font:inherit;font-weight:700;letter-spacing:.005em;border:0;border-radius:999px;cursor:pointer;color:var(--ink);background:var(--gold);padding:.6em 1.4em;font-size:1.15rem;line-height:1.2;transition:transform .16s,box-shadow .16s,background .16s,opacity .16s;display:inline-flex;align-items:center;justify-content:center;gap:.45em;text-align:center}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.3;cursor:default}
.btn.ghost{background:transparent;color:var(--ivory);box-shadow:inset 0 0 0 2px rgba(251,241,223,.28)}
.btn.rani{background:var(--ivory);color:var(--ink)}
.btn.danger{background:var(--vermilion);color:#fff}
.btn:focus{outline:none}
.btn:focus-visible,.ibtn:focus-visible,.avpick:focus-visible,.vbtn:focus-visible{outline:3px solid var(--ivory);outline-offset:4px}
.field:focus{outline:none;border-color:var(--gold)}
.ibtn{width:46px;height:46px;border-radius:50%;background:rgba(251,241,223,.07);border:0;color:var(--ivory);display:inline-grid;place-items:center;cursor:pointer;padding:0;font-size:21px;flex:none;transition:background .16s,transform .16s}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:1rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}

/* avatars: illustrated discs */
.av{--c:#D98E26;--s:56px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;position:relative;color:var(--ivory);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--c);
  box-shadow:inset 0 0 0 calc(var(--s)*.035) rgba(255,255,255,.18),0 calc(var(--s)*.06) calc(var(--s)*.18) rgba(0,0,0,.35)}
.av .avg{width:62%;height:62%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.av.away{filter:grayscale(1) brightness(.55)}
.av.red{box-shadow:0 0 0 calc(var(--s)*.05) var(--night),0 0 0 calc(var(--s)*.09) var(--vermilion),0 0 calc(var(--s)*.45) rgba(239,90,66,.5)}
.av.ghost{background:transparent;box-shadow:inset 0 0 0 2px rgba(251,241,223,.14)}
.av.pop{animation:popin .7s cubic-bezier(.2,1.5,.4,1) both}

.diya .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.8s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,190,80,.85))}
.big-diya{width:110px}
.hero-diya{width:120px}

@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(.96,1.07) skewX(2.5deg)}45%{transform:scale(1.03,.93) skewX(-2deg)}70%{transform:scale(.98,1.05) skewX(1.5deg)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spin2{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes bump{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes dots{0%,20%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}

/* fairy lights */
.lights circle{filter:drop-shadow(0 0 5px rgba(255,200,110,.9))}
.lights .b1{animation:twinkle 3.2s ease-in-out infinite}
.lights .b2{animation:twinkle 4.1s 1.2s ease-in-out infinite}
.lights .b3{animation:twinkle 2.7s .6s ease-in-out infinite}

/* ======================= TV ======================= */
.tv{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;font-size:32px;overflow:hidden;z-index:1}
.toplights{position:absolute;left:0;right:0;top:0;height:90px;pointer-events:none;opacity:.95}
.toplights svg{width:1920px;height:90px;display:block}
.tvh{position:absolute;left:72px;right:72px;top:84px;height:80px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:12px;font-size:36px;color:var(--ivory);line-height:1;width:460px}
.brand-diya{width:50px}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:40px}
.midtxt{font-size:30px;color:var(--muted);font-weight:600}
.rnd{font-size:30px;font-weight:700;color:var(--ivory);white-space:nowrap}
.rnd small{font-size:inherit;color:var(--muted);font-weight:500}
.track{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:30px}
.track li{position:relative;display:flex;align-items:center;font-size:27px;font-weight:600;color:rgba(251,241,223,.32);padding:6px 0;transition:color .3s}
.track li i{display:none}
.track li::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:4px;border-radius:4px;background:transparent;transition:background .3s}
.track li.done{color:var(--muted)}
.track li.cur{color:var(--gold)}
.track li.cur::after{background:var(--gold)}
.tools{display:flex;align-items:center;gap:14px;width:460px;justify-content:flex-end}
.roomchip{font-size:28px;color:var(--muted);display:flex;align-items:center;gap:12px;margin-right:6px;font-weight:600}
.roomchip b{color:var(--ivory);font-size:34px;letter-spacing:.08em;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;background:#777}
.dot.on{background:var(--jade);box-shadow:0 0 10px var(--jade)}
.dot.off{background:var(--gold);animation:dots 1.2s infinite}
.tv .ibtn{width:64px;height:64px;font-size:28px}
.tv .ibtn:focus{outline:4px solid var(--ivory);outline-offset:5px;background:rgba(251,241,223,.16)}
.tvm{position:absolute;left:72px;right:72px;top:196px;bottom:118px;display:grid;grid-template-columns:1fr 440px;gap:64px}
.stagewrap{position:relative;min-width:0}
.bgr{position:absolute;left:50%;top:50%;width:1000px;height:1000px;transform:translate(-50%,-50%);opacity:.035;animation:spin 300s linear infinite;pointer-events:none}
.bgr svg,.halo svg,.fr svg,.rdraw svg{width:100%;height:100%;display:block}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stage>*{position:relative}
.h1{font-family:"Rozha One",Georgia,serif;font-weight:400;font-size:96px;line-height:1.04;letter-spacing:.003em;color:var(--ivory)}
.h2{font-family:"Rozha One",Georgia,serif;font-weight:400;font-size:60px;line-height:1.08}
.stage .sub{font-size:38px;color:var(--muted);margin-top:18px;max-width:1080px;line-height:1.3;font-weight:500}
.stage .sub b{color:var(--ivory);font-weight:700}
.topic{display:inline-block;color:var(--muted);font-size:30px;font-weight:600;margin-bottom:16px}
.actrow{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:40px}
.tv .btn{font-size:34px;padding:20px 50px;white-space:nowrap}
.tv .btn.big{font-size:42px;padding:24px 66px}
.tv .btn:focus{outline:5px solid var(--ivory);outline-offset:7px;box-shadow:0 0 50px 6px rgba(242,181,68,.35);transform:scale(1.05);z-index:2}
.tv .btn.ghost:focus{box-shadow:inset 0 0 0 2px rgba(251,241,223,.5),0 0 40px rgba(251,241,223,.12)}
.tv .note{font-size:28px;color:var(--muted);font-weight:500}
.tchip{display:inline-flex;align-items:center;gap:12px;font-size:36px;color:var(--muted);font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.tnum.low,.low .tnum{color:var(--vermilion)}

/* rail */
.rail{padding-left:48px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail h3{font-size:26px;color:var(--muted);font-weight:600;margin:6px 0 14px;display:flex;justify-content:space-between;letter-spacing:.02em}
.rail h3 span{color:var(--faint)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:20px;padding:9px 0;font-size:32px;min-height:78px}
.prow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;display:flex;align-items:center;gap:10px}
.prow .sc{font-family:"Rozha One",Georgia,serif;font-size:42px;color:var(--ivory);min-width:56px;text-align:right;line-height:1}
.prow.isaway .nm{color:var(--muted)}
.prow.new{animation:rise .7s cubic-bezier(.2,1.3,.4,1) both}
.prow.empty .nm{color:rgba(251,241,223,.22);font-weight:500}
.crown{color:var(--gold);display:inline-flex;font-size:.85em}
.st{display:inline-flex;align-items:center;gap:6px;font-size:22px;color:var(--muted);font-weight:600}
.st.ok{color:var(--jade);font-size:36px}
.st.away .ic{font-size:24px}
.delta{background:var(--jade);color:var(--ink);border-radius:999px;padding:0 14px;font-weight:800;font-size:26px;line-height:1.5;animation:bump .9s 1.6s both}

/* footer caption */
.tvf{position:absolute;left:72px;right:72px;bottom:36px;height:56px;display:flex;align-items:center;gap:22px;font-size:30px;color:var(--muted)}
.tvf .cap2{flex:1;text-align:center;font-weight:500}
.tvf .muted{position:absolute;right:0;font-size:24px;color:var(--faint);white-space:nowrap;display:flex;align-items:center;gap:8px}
.tvf .warn{position:absolute;right:0;font-size:26px;color:var(--gold);white-space:nowrap}

/* lobby */
.lobby{display:grid;grid-template-columns:400px 1fr;gap:90px;align-items:center;width:100%;text-align:left}
.qrcol{display:flex;flex-direction:column;align-items:center}
.qrwrap{position:relative;padding:22px;border-radius:40px;background:linear-gradient(160deg,rgba(242,181,68,.55),rgba(242,181,68,.08) 60%,rgba(242,181,68,.4));}
.qr{position:relative;width:356px;height:356px;background:var(--ivory);border-radius:26px;padding:16px}
.qr svg{width:100%;height:100%;display:block}
.cap{margin-top:22px;font-size:30px;font-weight:600;color:var(--muted)}
.joinat{font-size:34px;color:var(--muted);font-weight:500}
.joinat b{color:var(--ivory);font-weight:700}
.digits{display:flex;gap:18px;margin:18px 0 44px}
.digit{width:128px;height:150px;border-radius:26px;background:var(--night2);box-shadow:inset 0 0 0 1px var(--line),0 12px 30px rgba(0,0,0,.25);display:grid;place-items:center;font-size:120px;line-height:1;color:var(--gold);padding-top:16px}
.opts{display:flex;flex-direction:column;gap:16px;margin-bottom:40px}
.optrow{display:flex;align-items:center;gap:18px}
.optrow .lbl{width:170px;font-size:28px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:var(--night2);box-shadow:inset 0 0 0 1px var(--line)}
.tv .btn.chip{font-size:26px;padding:8px 26px;background:transparent;color:var(--muted);box-shadow:none;font-weight:600}
.tv .btn.chip.sel{background:var(--ivory);color:var(--ink)}
.tv .btn.chip:focus{outline:4px solid var(--gold);outline-offset:3px;transform:none;box-shadow:none}
.tv .btn.chip.danger{background:var(--vermilion);color:#fff}
.startrow{display:flex;align-items:center;gap:34px}
.startrow .note{max-width:460px;line-height:1.3}

/* round title card */
.roundcard{position:absolute !important;inset:-60px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle,#24143E 0%,var(--night) 64%);border-radius:40px;animation:rcard 2.3s ease both;pointer-events:none}
.roundcard span{font-size:200px;line-height:1;color:var(--gold)}
.roundcard small{font-size:40px;color:var(--muted);font-weight:600}
@keyframes rcard{0%{opacity:0;transform:scale(.94)}12%{opacity:1;transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04);visibility:hidden}}

/* peek */
.readyrow{display:flex;gap:30px;justify-content:center;margin-top:48px;flex-wrap:wrap}
.rchip{position:relative;opacity:.4;transition:opacity .3s}
.rchip.ok{opacity:1}
.rchip .tick{position:absolute;right:-8px;bottom:-6px;width:38px;height:38px;border-radius:50%;background:var(--jade);color:var(--ink);display:grid;place-items:center;font-size:24px;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 4px var(--night)}
.rchip.ok .tick{transform:scale(1)}

/* clues */
.cluewrap{display:flex;align-items:center;gap:90px;text-align:left}
.ctext{display:flex;flex-direction:column;align-items:flex-start}
.kicker{font-size:30px;color:var(--gold);font-weight:700;letter-spacing:.02em}
.ctext .sub{margin-top:4px}
.ctext .tbar{width:560px;margin:30px 0 0}
.speaker{position:relative;width:220px;height:220px;display:grid;place-items:center;margin:50px}
.speaker .av{animation:popin .6s cubic-bezier(.2,1.5,.4,1) both}
.halo{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;opacity:.22;animation:spin2 50s linear infinite}
.sname{font-size:130px;animation:rise .5s .1s both;max-width:720px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.tbar{width:820px;height:10px;border-radius:99px;background:rgba(251,241,223,.1);overflow:hidden;margin:26px auto 0}
.tbar i{display:block;height:100%;background:var(--gold);transform-origin:left center;transition:transform .25s linear;border-radius:99px}
.tbar i.low{background:var(--vermilion)}
.order{list-style:none;padding:0;margin:44px 0 0;display:flex;gap:30px;justify-content:center}
.order li{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;transition:opacity .3s,transform .3s}
.order li.done{opacity:.3}
.order li.cur{transform:translateY(-6px)}
.order li.cur .av{box-shadow:0 0 0 4px var(--night),0 0 0 8px var(--gold),0 0 30px rgba(242,181,68,.5)}
.order .num{position:absolute;top:-6px;left:-6px;width:30px;height:30px;border-radius:50%;background:var(--night3);font-size:18px;display:grid;place-items:center;z-index:1;color:var(--muted);font-weight:700}
.order .onm{font-size:22px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-weight:600}
.order li.cur .onm{color:var(--ivory)}

/* timer ring */
.ringwrap{position:relative;width:400px;height:400px;margin-top:20px}
.ring{width:100%;height:100%;display:block}
.ring .trk{fill:none;stroke:rgba(251,241,223,.08);stroke-width:8}
.ring .prog{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .prog.low{stroke:var(--vermilion)}
.ringin{position:absolute;inset:0;display:grid;place-items:center;font-family:"Rozha One",Georgia,serif;font-size:140px;line-height:1;padding-top:14px}
.h1.dq{font-size:80px}
.dq+.ringwrap{width:360px;height:360px;margin-top:30px}

/* vote */
.votehead{display:flex;align-items:center;gap:44px}
.votehead .ringwrap{width:124px;height:124px;margin:0}
.votehead .h1{font-size:84px}
.votehead .ringin{font-size:52px;padding-top:6px}
.vgrid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-width:1240px;margin-top:34px}
.vt{width:214px;padding:20px 8px 16px;border-radius:30px;background:var(--night2);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;transition:box-shadow .3s,background .3s}
.vt .vn{font-size:28px;font-weight:700;max-width:196px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt .vs{font-size:22px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.vt.voted{box-shadow:inset 0 0 0 3px var(--jade);background:rgba(60,198,168,.08)}
.vt.voted .vs{color:var(--jade)}

/* guess */
.caught .av{animation:popin .6s cubic-bezier(.2,1.5,.4,1) both}
.caught{margin-bottom:26px}
.stage .caught+.h1{font-size:84px}
.gbox{margin-top:34px;min-width:760px;min-height:170px;border-radius:32px;background:var(--night2);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 44px}
.gtext{font-size:96px;line-height:1.05;color:var(--ivory)}
.verdict{font-size:30px;font-weight:700;border-radius:999px;padding:2px 24px}
.verdict.ok{background:var(--jade);color:var(--ink)}
.verdict.no{background:var(--vermilion);color:#fff}
.typing{font-size:38px;color:var(--muted)}
.typing i{font-style:normal;animation:dots 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* verdict: the vote result moment */
.verdict-s{position:relative;display:flex;flex-direction:column;align-items:center}
.verdict-s .r1{font-size:42px;color:var(--muted);font-weight:600;animation:fade .5s .1s both}
.verdict-s .r2.vp{display:flex;align-items:center;gap:36px;margin:18px 0 6px;animation:popin .7s .5s cubic-bezier(.2,1.5,.4,1) both}
.stamp{margin-top:28px;font-size:92px;line-height:1;padding:20px 56px 6px;border-radius:28px;transform:rotate(-4deg);animation:stamp .45s 2.3s cubic-bezier(.2,1.8,.4,1) both;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.verdict-s.good .stamp{background:var(--jade);color:var(--ink)}
.verdict-s.bad .stamp{background:var(--vermilion);color:#fff}
.verdict-s .r6{animation:rise .5s 3.2s both;margin-top:60px}
@keyframes stamp{0%{opacity:0;transform:rotate(-4deg) scale(2.6)}100%{opacity:1;transform:rotate(-4deg) scale(1)}}

/* reveal: the one moment that gets full colour */
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
.rdraw{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;opacity:.3;pointer-events:none;-webkit-mask:radial-gradient(circle,transparent 26%,#000 52%);mask:radial-gradient(circle,transparent 26%,#000 52%)}
.rdraw .draw path,.rdraw .draw circle{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease-out forwards}
.r1{font-size:42px;color:var(--muted);font-weight:600;animation:fade .6s .2s both}
.r2{display:flex;align-items:center;gap:36px;margin:18px 0 10px;animation:popin .8s 1.55s cubic-bezier(.2,1.4,.4,1) both}
.rname{font-size:150px;line-height:1}
.reveal.bad .rname{color:#FF8B76}
.r3{font-size:42px;color:var(--muted);animation:rise .6s 2.4s both;font-weight:600}
.rword{font-size:92px;color:var(--gold);margin-left:14px;vertical-align:-6px}
.r4{font-size:36px;margin-top:16px;animation:rise .6s 2.9s both;max-width:1150px;color:var(--ivory);line-height:1.3}
.r5{animation:rise .6s 3.3s both}
.r6{animation:rise .6s 3.6s both}
.reveal.quick .r3{animation-delay:.25s}.reveal.quick .r4{animation-delay:.9s}.reveal.quick .r5{animation-delay:1.3s}.reveal.quick .r6{animation-delay:1.6s}
.reveal .r3.big{margin-top:6px}
.reveal .r3.big .rword{font-size:160px;margin:0;line-height:1.05;display:inline-block}
.vchips{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 22px;margin-top:26px;max-width:1150px}
