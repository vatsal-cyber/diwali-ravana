<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diwali: Find the Ravana</title>
<script src="qrcode.min.js"></script>
<script src="mqtt.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff4dc;background:#2a0a14}
body{background:radial-gradient(1200px 700px at 50% -10%,#7a1d2e 0%,#3b0d1a 55%,#1e060d 100%) fixed;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:clamp(28px,6vw,54px);margin:6px 0 4px;color:#ffd166}
h2{margin:0 0 8px;color:#ffd166;font-size:clamp(20px,3vw,32px)}
p{line-height:1.45;margin:6px 0}
.sub{opacity:.85}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 20px;font-size:18px;font-weight:700;color:#3b0d1a;background:linear-gradient(#ffd166,#f4a300);cursor:pointer;box-shadow:0 4px 0 #a86a00;font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a86a00}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.alt{background:#5a1b2c;color:#ffe9b8;box-shadow:0 4px 0 #2a0a14;border:1px solid #a94b60}
.btn.big{font-size:clamp(20px,3.6vw,30px);padding:18px 26px}
.btn.sel{outline:4px solid #fff}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card{background:rgba(255,230,170,.08);border:1px solid rgba(255,209,102,.35);border-radius:18px;padding:18px;margin-top:12px}
.code{font-size:clamp(54px,14vw,130px);font-weight:900;letter-spacing:.1em;color:#fff;text-shadow:0 0 24px #f4a300;line-height:1}
.pill{display:inline-block;background:#ffd166;color:#3b0d1a;border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.small{font-size:13px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chip{display:flex;align-items:center;gap:10px;background:#4a1424;border:1px solid #ffd166;border-radius:999px;padding:8px 18px;font-size:clamp(18px,3vw,28px);font-weight:800}
.chip i{font-style:normal;background:#ffd166;color:#3b0d1a;border-radius:50%;min-width:1.6em;height:1.6em;display:grid;place-items:center;font-size:.8em}
.chip.cur{background:#ffd166;color:#3b0d1a;transform:scale(1.08);box-shadow:0 0 28px #f4a300}
.chip.cur i{background:#3b0d1a;color:#ffd166}
.chip.done{opacity:.4}
.chip.ok{border-color:#7be0a0}
.timer{font-size:clamp(80px,24vw,220px);font-weight:900;text-align:center;color:#ffd166;line-height:1}
.flame{display:inline-block;animation:fl 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fl{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(3deg)}}
.hero{text-align:center}
.qr{background:#fff;border-radius:16px;padding:8px;width:clamp(150px,26vw,260px)}
.qr svg{display:block;width:100%;height:auto}
.joinbox{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.sc{background:#4a1424;border:1px solid #a94b60;border-radius:14px;padding:10px;text-align:center}
.sc b{display:block;font-size:clamp(16px,2.4vw,22px)}
.sc span{font-size:clamp(26px,4vw,40px);font-weight:900;color:#ffd166}
.sc em{display:block;font-style:normal;color:#7be0a0;font-weight:800;min-height:1.2em}
.holdcard{user-select:none;-webkit-user-select:none;touch-action:none;margin:12px 0;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-radius:24px;padding:18px;background:linear-gradient(160deg,#ffd166,#f4a300);color:#3b0d1a;box-shadow:0 8px 0 #a86a00,0 0 40px rgba(244,163,0,.45)}
.holdcard.hidden{background:linear-gradient(160deg,#5a1b2c,#3b0d1a);color:#ffd166;box-shadow:0 8px 0 #1e060d;border:2px dashed #ffd166}
.holdcard .w{font-size:clamp(34px,11vw,60px);font-weight:900;line-height:1.05}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
input.txt{width:100%;font-size:26px;text-align:center;padding:12px;border-radius:14px;border:2px solid #ffd166;background:#2a0a14;color:#fff;font-weight:800;font-family:inherit}
input.codein{letter-spacing:.2em;font-size:34px}
.turn{font-size:clamp(22px,5vw,34px);font-weight:900;color:#3b0d1a;background:#ffd166;border-radius:16px;padding:14px;text-align:center;animation:fl 1.1s ease-in-out infinite}
.rev{text-align:center}
.rev .big{font-size:clamp(28px,5.5vw,56px);font-weight:900}
a{color:#ffd166}
#ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:#1e060d}
#ov.on{display:flex}
#ov .t{font-size:clamp(40px,10vw,110px);font-weight:900;color:#ffd166;line-height:1.05}
#ov .s{font-size:clamp(18px,3vw,30px);opacity:.85;margin-top:12px}
.mycard{border:2px dashed #ffd166}
.btn.stealth:active{transform:none;box-shadow:0 4px 0 #2a0a14}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<script>
var JOIN_URL = (function () { try { return location.href.split("#")[0]; } catch (e) { return ""; } })();
var BROKERS = window.RAVANA_BROKERS || ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://mqtt.eclipseprojects.io:443/mqtt"];
var TOPIC_ROOT = "diwali-ravana-v1/";
var WORDS = {
  "Sweets": ["Ladoo","Jalebi","Gulab jamun","Kaju katli","Barfi","Rasmalai","Soan papdi","Peda"],
  "Snacks": ["Samosa","Chakli","Namak pare","Kachori","Chivda","Mathri"],
  "Decor": ["Diya","Rangoli","Marigold garland","Fairy lights","Paper lantern","Torana"],
  "Fireworks": ["Sparkler","Flowerpot","Rocket","Ground spinner","Snake tablet","Cracker string"],
  "Story": ["Rama","Sita","Hanuman","Lakshmana","Ayodhya","Lakshmi","Ganesha"],
  "Rituals": ["Lakshmi puja","Aarti","Tilak","Dhanteras","Bhai Dooj","Govardhan puja"],
  "Party": ["New clothes","Teen patti","Gift box","Dhol","Dance-off","Group selfie","Family photo"]
};
var me = { id: Math.random().toString(36).slice(2, 10) };
var S = { view: "home", code: "", name: "", status: "idle", room: null, peers: [], mine: null, H: null, sig: "", tm: null, tallyTimer: null, guessText: "", joinedAt: Date.now(), hostVote: null, hostGuess: "", hostGuessSent: "", peeking: false };

/* ---------- helpers ---------- */
function $(h) { document.getElementById("app").innerHTML = h; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function hash(s) { var h = 1779033703 ^ s.length; for (var i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return h >>> 0; }
function rng(seed) { var a = seed; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function rd(code, salt, round, players) {
  var r = rng(hash(code + "|" + salt + "|" + round));
  var cats = Object.keys(WORDS);
  var cat = cats[Math.floor(r() * cats.length)];
  var list = WORDS[cat];
  var word = list[Math.floor(r() * list.length)];
  var n = players.length;
  var ravIdx = Math.floor(r() * n);
  var order = []; for (var i = 0; i < n; i++) order.push(i);
  for (var j = n - 1; j > 0; j--) { var k = Math.floor(r() * (j + 1)); var t = order[j]; order[j] = order[k]; order[k] = t; }
  return { cat: cat, word: word, ravanaId: players[ravIdx].id, order: order };
}
function norm(p) {
  var arr = Array.isArray(p) ? p : (p && typeof p === "object" ? Object.keys(p).map(function (k) { return p[k]; }) : []);
  var map = {}, out = [];
  arr.forEach(function (e) {
    if (!e) return;
    var st = e.state || e.presence || e.data || e.value || e;
    if (st && st.app === "ravana" && st.id) map[st.id + st.role] = st;
  });
  Object.keys(map).forEach(function (k) { out.push(map[k]); });
  return out;
}
function livePlayers() {
  var list = S.peers.filter(function (p) { return p.role === "player" && p.code === S.code && p.name; });
  if (S.mine && S.mine.role === "player" && !list.some(function (p) { return p.id === S.mine.id; })) list.push(S.mine);
  var HH = (S.view === "host") ? S.H : hostState();
  if (HH && HH.hostPlays && HH.hostName && !list.some(function (p) { return p.id === HH.id; })) list.push({ id: HH.id, name: HH.hostName, joinedAt: 0 });
  list.sort(function (a, b) { return (a.joinedAt || 0) - (b.joinedAt || 0) || (a.id < b.id ? -1 : 1); });
  return list;
}
function playerState(id) {
  for (var i = 0; i < S.peers.length; i++) if (S.peers[i].role === "player" && S.peers[i].id === id) return S.peers[i];
  return null;
}
function hostState() {
  var best = null;
  S.peers.forEach(function (p) { if (p.role === "host" && p.code === S.code && (!best || (p.v || 0) >= (best.v || 0))) best = p; });
  return best;
}
function nameOf(H, id) { return (H.names && H.names[id]) || "?"; }
function voteOf(H, id) {
  if (S.view === "host" && id === me.id) return S.hostVote && S.hostVote.round === H.round ? S.hostVote.target : null;
  var st = playerState(id); return st && st.vote && st.vote.round === H.round ? st.vote.target : null;
}
function guessOf(H, id) {
  if (S.view === "host" && id === me.id) return S.hostGuessSent;
  var st = playerState(id); return st && st.guess && st.guess.round === H.round ? st.guess.text : "";
}

/* ---------- live relay (MQTT over WebSocket, two public brokers in parallel) ---------- */
function makeRoom(code) {
  return new Promise(function (resolve) {
    if (!window.mqtt) { resolve(null); return; }
    var base = TOPIC_ROOT + code + "/p/", peers = {}, cb = null, mine = null, clients = [], done = false;
    function emit() {
      if (!cb) return;
      var now = Date.now(), arr = [];
      Object.keys(peers).forEach(function (k) { var p = peers[k]; if (Math.abs(now - (p._ts || 0)) < 90000) arr.push(p); });
      cb(arr);
    }
    function onMsg(topic, payload) {
      var id = topic.slice(base.length), txt = payload ? payload.toString() : "";
      if (id === me.id) return;
      if (!txt) { if (peers[id]) { delete peers[id]; emit(); } return; }
      var st; try { st = JSON.parse(txt); } catch (e) { return; }
      if (!st || st.app !== "ravana") return;
      var old = peers[id];
      if (old && (old._ts || 0) > (st._ts || 0)) return;
      peers[id] = st; emit();
    }
    function pub1(c) { try { c.publish(base + me.id, JSON.stringify(mine), { retain: true, qos: 0 }); } catch (e) { } }
    function pubAll() { clients.forEach(function (c) { if (c.connected) pub1(c); }); }
    var api = {
      presence: function (st) { mine = JSON.parse(JSON.stringify(st)); mine._ts = Date.now(); peers[me.id] = mine; pubAll(); emit(); },
      onPeers: function (f) { cb = f; emit(); },
      leave: function () { clearInterval(hb); clients.forEach(function (c) { try { c.publish(base + me.id, "", { retain: true, qos: 0 }); c.end(); } catch (e) { } }); }
    };
    BROKERS.forEach(function (url) {
      var c;
      try {
        c = mqtt.connect(url, Object.assign({ clientId: "rv_" + me.id + "_" + Math.random().toString(36).slice(2, 6), keepalive: 30, reconnectPeriod: 3000, connectTimeout: 8000, clean: true, will: { topic: base + me.id, payload: "", retain: true, qos: 0 } }, window.RAVANA_MQTT_OPTS || {}));
      } catch (e) { return; }
      clients.push(c);
      c.on("connect", function () { c.subscribe(base + "+", { qos: 0 }); if (mine) pub1(c); if (!done) { done = true; resolve(api); } });
      c.on("message", onMsg);
      c.on("error", function () { });
    });
    var hb = setInterval(function () { if (mine) { mine._ts = Date.now(); peers[me.id] = mine; pubAll(); } emit(); }, 10000);
    setTimeout(function () { if (!done) { done = true; clearInterval(hb); clients.forEach(function (c) { try { c.end(true); } catch (e) { } }); resolve(null); } }, 12000);
  });
}

/* ---------- connection ---------- */
async function openRoom(code) {
  S.code = code; S.status = "connecting"; render();
  var r = null;
  try { r = await makeRoom(code); } catch (e) { r = null; }
  if (!r) { S.status = "offline"; render(); return false; }
  S.room = r;
  r.onPeers(function (p) { S.peers = norm(p); update(); });
  S.status = "online";
  return true;
}
function pubHost() { var H = S.H; H.v = (H.v || 0) + 1; try { S.room.presence(H); } catch (e) { } S.sig = ""; render(); }
function pubMine(patch) {
  for (var k in patch) S.mine[k] = patch[k];
  try { S.room.presence(S.mine); } catch (e) { }
}

/* ---------- routing / render ---------- */
function go(v) { S.view = v; S.sig = ""; render(); }
function sigNow() {
  var live = livePlayers().map(function (p) { return p.id + ":" + p.name; }).join(",");
  if (S.view === "host" && S.H) {
    var ex = "";
    if (S.H.phase === "vote" || S.H.phase === "guess") {
      ex = S.H.players.map(function (pl) { var st = playerState(pl.id); return (st && st.vote && st.vote.round === S.H.round ? "v" : "-") + (st && st.guess && st.guess.round === S.H.round ? st.guess.text : ""); }).join("");
    }
    return "h|" + S.H.v + "|" + live + "|" + ex;
  }
  if (S.view === "player") { var H = hostState(); return "p|" + (H ? H.v : "x") + "|" + live; }
  return S.view + "|" + S.status;
}
function update() {
  var s = sigNow();
  if (s !== S.sig) { S.sig = s; render(); }
  if (S.view === "host" && S.H && S.H.phase === "vote") checkAllVoted();
}
function render() {
  var ae = document.activeElement, keepId = ae && ae.id, keepVal = ae && ae.value;
  if (S.tm) { clearInterval(S.tm); S.tm = null; }
  if (S.view === "home") home();
  else if (S.view === "join") join();
  else if (S.view === "host") host();
  else if (S.view === "player") player();
  else if (S.view === "offchoose") offChoose();
  else if (S.view === "offhost") offHost();
  else if (S.view === "offjoin") offJoin();
  else if (S.view === "offplayer") offPlayer();
  if (keepId) { var e = document.getElementById(keepId); if (e && e.tagName === "INPUT") { e.value = keepVal; try { e.focus(); } catch (x) { } } }
  if (S.view === "host" && S.H && S.H.phase === "discuss") startTimer();
}
function offlineBox() {
  return '<div class="card"><h2>Could not reach the live server</h2><p>Check that this device is on Wi-Fi or mobile data, then try again. Some office or school networks block it.</p>' +
    '<p><b>You can still play right now</b> without it. Everyone just uses the room code and a seat number.</p>' +
    '<div class="row" style="margin-top:10px"><button class="btn big" onclick="S.status=\'idle\';offStartHost()">📺 Use as TV (no sync)</button><button class="btn big alt" onclick="S.status=\'idle\';go(\'offjoin\')">📱 Join as player (no sync)</button></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn alt" onclick="S.status=\'idle\';go(\'home\')">Try live sync again</button></div></div>';
}

/* ---------- home & join ---------- */
function home() {
  $('<div class="hero"><div style="font-size:64px" class="flame">🪔</div><h1>Find the Ravana</h1>' +
    '<p class="sub">Live Diwali party game for 3 to 8 people. Everyone gets the same secret word except one sneaky Ravana. Give one-word clues, vote, and save Ayodhya.</p></div>' +
    '<div class="card"><h2>Set up</h2><p><b>1.</b> Open this page on the <b>TV browser</b> (or a mirrored phone or laptop) and tap <b>I am the TV</b>.</p>' +
    '<p><b>2.</b> Everyone scans the QR code on the TV (or opens the link and types the 4-digit code).</p>' +
    '<p><b>3.</b> Enter a name and play. Phones are the secret cards and voting buttons.</p></div>' +
    '<div class="row" style="justify-content:center;margin-top:18px"><button class="btn big" onclick="startHost()">📺 I am the TV</button><button class="btn big alt" onclick="go(\'join\')">📱 I am a player</button></div>' +
    '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn alt" onclick="go(\'offchoose\')">🔌 Play without live sync</button></div>');
}
function join() {
  var h = '<h1>Join the game</h1>';
  if (S.status === "offline") { $(h + offlineBox()); return; }
  var busy = S.status === "connecting";
  h += '<div class="card"><p>Room code (shown on the TV)</p><input class="txt codein" id="ci" inputmode="numeric" maxlength="4" placeholder="0000" value="' + esc(S.code) + '">' +
    '<p style="margin-top:12px">Your name</p><input class="txt" id="ni" maxlength="14" placeholder="Name" value="' + esc(S.name) + '">' +
    '<div class="row" style="margin-top:16px"><button class="btn big" id="jb" ' + (busy ? "disabled" : "") + ' onclick="doJoin()">' + (busy ? "Connecting…" : "Join") + '</button><button class="btn alt" onclick="go(\'home\')">Back</button></div></div>';
  $(h);
}
async function doJoin() {
  var c = (document.getElementById("ci").value || "").trim(), n = (document.getElementById("ni").value || "").trim();
  S.name = n;
  try { localStorage.setItem("ravana_name", n); } catch (e) { }
  if (c.length < 4 || !n) { S.code = c; join(); return; }
  S.view = "join";
  var ok = await openRoom(c);
  if (!ok || S.view !== "join") return;
  S.mine = { app: "ravana", role: "player", id: me.id, code: c, name: n, joinedAt: S.joinedAt, vote: null, guess: null };
  try { S.room.presence(S.mine); } catch (e) { }
  go("player");
}

/* ---------- HOST (TV) ---------- */
async function startHost() {
  var code = String(1000 + Math.floor(Math.random() * 9000));
  S.view = "host"; S.H = null;
  var ok = await openRoom(code);
  if (S.view !== "host") return;
  if (!ok) { S.view = "join"; render(); return; }
  S.H = { app: "ravana", role: "host", id: me.id, code: code, v: 0, phase: "lobby", round: 0, salt: "", players: [], names: {}, scores: {}, clueIdx: 0, timerEnd: 0, result: null };
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () { }); } catch (e) { }
  pubHost();
}
function qrSvg(text) {
  try {
    var q = qrcode(0, "M"); q.addData(text); q.make();
    var n = q.getModuleCount(), m = 2, t = n + 2 * m;
    var s = '<svg viewBox="0 0 ' + t + ' ' + t + '" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/>';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) s += '<rect x="' + (c + m) + '" y="' + (r + m) + '" width="1" height="1" fill="#3b0d1a"/>';
    return s + "</svg>";
  } catch (e) { return ""; }
}
function goFull() { try { var el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen().catch(function () { }); } catch (e) { } }
function scoreboard(H, showDelta) {
  var arr = H.players.slice().sort(function (a, b) { return (H.scores[b.id] || 0) - (H.scores[a.id] || 0); });
  var h = '<div class="board">';
  arr.forEach(function (p) {
    var d = showDelta && H.result ? H.result.delta[p.id] : 0;
    h += '<div class="sc"><b>' + esc(p.name) + '</b><span>' + (H.scores[p.id] || 0) + '</span><em>' + (d ? "+" + d : "") + '</em></div>';
  });
  return h + "</div>";
}
function host() {
  var H = S.H;
  if (S.status === "offline") { $(offlineBox()); return; }
  if (!H) { $('<div class="hero"><h1>Connecting…</h1><p class="sub">This can take up to 15 seconds.</p><button class="btn alt" onclick="offStartHost()">Skip: use the TV without live sync</button></div>'); return; }
  var live = livePlayers();
  var h = "";
  if (H.phase === "lobby") {
    var link = JOIN_URL.indexOf("PLACEHOLDER") > -1 ? "" : JOIN_URL + "#join-" + H.code;
    h += '<div class="joinbox"><div><div class="small">ROOM CODE</div><div class="code">' + H.code + '</div></div>';
    if (link) { var q = qrSvg(link); if (q) h += '<div><div class="qr">' + q + '</div><div class="small" style="text-align:center;margin-top:4px">Scan to join</div></div>'; }
    h += '</div><p class="sub">Open the same link on your phone and enter the code, or scan the QR.</p>';
    h += '<div class="card"><h2>Players (' + live.length + ')</h2><div class="chips">';
    if (!live.length) h += '<span class="sub">Waiting for phones to join…</span>';
    live.forEach(function (p) { h += '<div class="chip ok">' + esc(p.name) + '</div>'; });
    h += '</div><div class="row"><button class="btn big" ' + (live.length < 3 ? "disabled" : "") + ' onclick="startRound()">Start game</button>';
    h += '<button class="btn alt" onclick="goFull()">Full screen</button>';
    h += '<span class="small">' + (live.length < 3 ? "Need at least 3 players" : "Up to 8 players work best") + '</span></div></div>';
    h += '<div class="card mycard"><h2>📱 Playing from this phone too?</h2>';

      (O.mySeat ? '<button class="btn alt" onclick="offPeek()">🙈 Peek again</button>' : '') + '<button class="btn big" onclick="O.stage=\'vote\';render()">Vote now</button><button class="btn alt" onclick="O.left+=30;render()">+30s</button></div></div>';
  } else if (O.stage === "vote") {
    h += '<div class="card"><h2>3. Vote</h2><p>Count 3, 2, 1 and everyone <b>points at one person</b> at the same time. Tap the person with the most fingers on them.</p><div class="board">';
    for (var v = 1; v <= O.n; v++) h += '<button class="btn" style="font-size:22px;padding:18px 8px" onclick="offPick(' + v + ')">' + offName(v) + '</button>';
    h += '</div></div>';
  } else {
    var caught = O.pick === d.ravana;
    h += '<div class="card rev"><div class="small">The group picked ' + offName(O.pick) + '</div><div style="font-size:56px">' + (caught ? '🎉' : '👹') + '</div><div class="big">' + offName(d.ravana) + ' was the Ravana!</div>' +
      '<p>Secret word: <b style="font-size:1.8em;color:#ffd166">' + esc(d.word) + '</b> <span class="small">(' + esc(d.cat) + ')</span></p>';
    if (caught) {
      h += '<p><b>Caught!</b> Everyone else +1. The Ravana gets one guess at the word, out loud.</p>';
      h += O.resolved ? '<p class="pill">Round scored</p>' : '<div class="row" style="justify-content:center"><button class="btn big" onclick="offGuess(true)">Ravana guessed it (+2)</button><button class="btn big alt" onclick="offGuess(false)">Wrong</button></div>';
    } else h += '<p><b>Escaped!</b> The Ravana scores +2.</p><p class="pill">Round scored</p>';
    h += '<div style="margin-top:14px"><button class="btn big" onclick="offNext()">Next round →</button></div></div>';
  }
  h += '<div class="card"><h2>Scores</h2>' + offBoard() + '</div>';
  $(h);
  if (O.stage === "discuss") {
    S.tm = setInterval(function () {
      O.left--; var e = document.getElementById("tm"); if (e) e.textContent = Math.max(O.left, 0);
      if (O.left <= 0) { clearInterval(S.tm); S.tm = null; O.stage = "vote"; render(); }
    }, 1000);
  }
}
function offPeek() { var d = offRd(O.code, O.round); showPeek(O.names[O.mySeat - 1] || ("Seat " + O.mySeat), d.ravana === O.mySeat, d); }
function offPick(i) {
  var d = offRd(O.code, O.round); O.pick = i; O.resolved = false;
  if (i === d.ravana) { for (var s = 1; s <= O.n; s++) if (s !== d.ravana) O.scores[s - 1] += 1; }
  else { O.scores[d.ravana - 1] += 2; O.resolved = true; }
  O.stage = "reveal"; render();
}
function offGuess(ok) { var d = offRd(O.code, O.round); if (ok) O.scores[d.ravana - 1] += 2; O.resolved = true; render(); }
function offNext() { O.round++; O.stage = "clues"; O.pick = 0; O.resolved = false; render(); }
function offJoin() {
  var n = parseInt((O.code || "").charAt(0), 10); if (!(n >= 3 && n <= 8)) n = 8;
  var h = '<h1>Join (no sync)</h1><div class="card"><p>Room code from the TV</p><input class="txt codein" id="oci" inputmode="numeric" maxlength="4" placeholder="0000" value="' + esc(O.code) + '" oninput="O.code=this.value.trim();if(O.code.length===4)render()">' +
    '<p style="margin-top:12px">Your seat number</p><div class="row">';
  for (var i = 1; i <= n; i++) h += '<button class="btn ' + (O.seat === i ? "sel" : "alt") + '" style="min-width:64px" onclick="O.seat=' + i + ';render()">' + i + '</button>';
  h += '</div><div class="row" style="margin-top:16px"><button class="btn big" onclick="offStartPlayer()">Join</button><button class="btn alt" onclick="go(\'offchoose\')">Back</button></div></div>';
  $(h);
}
function offStartPlayer() {
  var e = document.getElementById("oci"); if (e) O.code = e.value.trim();
  var n = parseInt(O.code.charAt(0), 10);
  if (O.code.length !== 4 || !(n >= 3 && n <= 8) || !O.seat || O.seat > n) return;
  O.round = 1; go("offplayer");
}
function offPlayer() {
  var d = offRd(O.code, O.round), iRav = d.ravana === O.seat, pos = d.order.indexOf(O.seat) + 1;
  var h = '<div class="row" style="justify-content:space-between"><span class="pill">Room ' + esc(O.code) + '</span><span class="pill">Seat ' + O.seat + '</span></div>';
  h += '<div class="holdcard hidden" id="hc"></div>';
  h += '<p style="text-align:center">You speak <b>#' + pos + '</b> in the clue round.</p>';
  h += '<div class="card hero"><div class="small">ROUND (must match the TV)</div><div style="display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px">' +
    '<button class="btn alt" style="width:60px;height:60px;padding:0;font-size:28px" onclick="O.round=Math.max(1,O.round-1);render()">−</button><b style="font-size:48px">' + O.round + '</b>' +
    '<button class="btn" style="width:60px;height:60px;padding:0;font-size:28px" onclick="O.round++;render()">+</button></div><p class="small">When the TV says the next round, tap +.</p></div>';
  $(h);
  var hc = document.getElementById("hc");
  function hide() { hc.className = "holdcard hidden"; hc.innerHTML = '<div style="font-size:44px" class="flame">🪔</div><div class="w">Hold to peek</div><p>Press and hold. Let go to hide.</p>'; }
  function show() {
    hc.className = "holdcard";
    hc.innerHTML = iRav ? '<div style="font-size:52px">👹</div><div class="w">You are the RAVANA</div><p>You do not know the word. Topic: <b>' + esc(d.cat) + '</b>. Bluff!</p>'
      : '<div class="small" style="color:#3b0d1a">SECRET WORD</div><div class="w">' + esc(d.word) + '</div><p>Topic: ' + esc(d.cat) + '. One of you is the Ravana.</p>';
  }
  hide();
  hc.addEventListener("pointerdown", function (e) { e.preventDefault(); show(); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { hc.addEventListener(ev, hide); });
  hc.addEventListener("contextmenu", function (e) { e.preventDefault(); });
}

/* ---------- boot ---------- */
function readHash() {
  try {
    var m = /^#join-(\d{4})$/.exec(location.hash || "");
    if (m && S.view === "home") { S.code = m[1]; try { S.name = localStorage.getItem("ravana_name") || ""; } catch (e) { } S.view = "join"; }
    var mo = /^#off-(\d{4})$/.exec(location.hash || "");
    if (mo && S.view === "home") { O.code = mo[1]; S.view = "offjoin"; }
  } catch (e) { }
}
readHash();
try { window.addEventListener("hashchange", function () { readHash(); render(); }); } catch (e) { }
render();
</script>
</body>
</html>
